name: Astra checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 25.9.0]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:offline
      - run: npm run check
      - name: Reject unexpected formatter changes
        run: git diff --exit-code
      - name: Archive and source export regressions
        run: node --test scripts/check-astra-runtime-boundary.test.mjs scripts/prepare-astra-source.test.mjs scripts/sync-versions.test.mjs
      - name: Local workbench and migration regressions
        working-directory: packages/astra
        run: node ../../node_modules/vitest/dist/cli.js --run test/workbench.test.ts test/research.test.ts
      - name: Packaged workbench without model calls
        run: node scripts/smoke-astra-package.mjs
      - name: Prepare Astra package locally
        run: npm run astra:package
