name: 改进建议
description: 描述具体使用问题与希望获得的行为
body:
  - type: textarea
    id: problem
    attributes:
      label: 当前遇到什么问题
      description: 请描述使用场景和受影响的版本。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望怎样改进
      description: 说明预期行为，以及是否愿意参与实现。
    validations:
      required: true
