[package]
name = "research-cli"
version = "0.1.0"
edition = "2021"
default-run = "astra"

[lib]
name = "research_cli"
path = "src/lib.rs"

[[bin]]
name = "research-cli"
path = "src/bin/research-cli.rs"

[[bin]]
name = "astra"
path = "src/bin/astra.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
jsonschema = "0.18"
ureq = "3.3"
libc = "0.2"
crossterm = "0.28"
pulldown-cmark = "0.13"
ratatui = "0.29"
rustyline = "15"
syntect = "5"
unicode-width = "0.2"
